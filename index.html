<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドライブ・散歩 計画＆実施表</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      background-color: #f4f6f8;
      color: #333;
    }
    h1 { font-size: 1.3rem; text-align: center; margin-bottom: 16px; }
    .card {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .form-group { display: flex; gap: 8px; margin-bottom: 10px; }
    input[type="text"], input[type="time"] {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    input[type="text"] { flex: 1; }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-add { background: #007aff; color: #fff; width: 100%; }
    .btn-gps { background: #34c759; color: #fff; width: 100%; margin-top: 8px; }
    .btn-del { background: #ff3b30; color: #fff; font-size: 0.8rem; padding: 6px 10px; }
    .spot-item {
      border-left: 5px solid #007aff;
      padding-left: 12px;
      margin-bottom: 14px;
    }
    .spot-item.done { border-left-color: #34c759; }
    .spot-header { display: flex; justify-content: space-between; align-items: center; }
    .spot-title { font-weight: bold; font-size: 1.1rem; }
    .meta { font-size: 0.85rem; color: #666; margin-top: 4px; }
    .result {
      background: #eafaf1;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 8px;
      font-size: 0.85rem;
    }
    .map-link { color: #007aff; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <h1>🚗 ドライブ・散歩 計画＆実施表</h1>

  <!-- 計画追加フォーム -->
  <div class="card">
    <div class="form-group">
      <input type="time" id="planTime" value="10:00">
      <input type="text" id="spotName" placeholder="行き先（例：道の駅〇〇）">
    </div>
    <button class="btn-add" onclick="addSpot()">＋ 計画に追加</button>
  </div>

  <!-- 計画・実施リスト -->
  <div id="spotList"></div>

  <script>
    // 保存データの読み込み
    let spots = JSON.parse(localStorage.getItem('drive_spots') || '[]');

    function save() {
      localStorage.setItem('drive_spots', JSON.stringify(spots));
      render();
    }

    // 計画を追加
    function addSpot() {
      const time = document.getElementById('planTime').value;
      const name = document.getElementById('spotName').value.trim();
      if (!name) {
        alert('行き先を入力してください');
        return;
      }
      spots.push({
        id: Date.now(),
        planTime: time,
        name: name,
        actualTime: null,
        lat: null,
        lng: null
      });
      document.getElementById('spotName').value = '';
      save();
    }

    // GPSと現在時刻を記録（チェックイン）
    function checkIn(id) {
      if (!navigator.geolocation) {
        alert('このブラウザはGPSに対応していません');
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const now = new Date();
          const timeStr = now.toTimeString().slice(0, 5); // HH:MM
          const target = spots.find(s => s.id === id);
          if (target) {
            target.actualTime = timeStr;
            target.lat = pos.coords.latitude.toFixed(6);
            target.lng = pos.coords.longitude.toFixed(6);
            save();
          }
        },
        (err) => {
          alert('位置情報の取得に失敗しました。\n設定で位置情報を許可してください。(' + err.message + ')');
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // 削除
    function deleteSpot(id) {
      if (confirm('この項目を削除しますか？')) {
        spots = spots.filter(s => s.id !== id);
        save();
      }
    }

    // 画面を描画
    function render() {
      const list = document.getElementById('spotList');
      list.innerHTML = '';

      if (spots.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#888;">計画がまだありません</p>';
        return;
      }

      spots.forEach(s => {
        const isDone = s.actualTime !== null;
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <div class="spot-item ${isDone ? 'done' : ''}">
            <div class="spot-header">
              <div class="spot-title">${s.name}</div>
              <button class="btn-del" onclick="deleteSpot(${s.id})">削除</button>
            </div>
            <div class="meta">予定時刻：${s.planTime || '未設定'}</div>
            ${isDone ? `
              <div class="result">
                ✅ <strong>到着時刻：${s.actualTime}</strong><br>
                📍 緯度: ${s.lat}, 経度: ${s.lng}<br>
                <a class="map-link" href="https://maps.google.com/?q=${s.lat},${s.lng}" target="_blank">🗺 Googleマップで場所を見る</a>
              </div>
            ` : `
              <button class="btn-gps" onclick="checkIn(${s.id})">📍 到着を記録（GPS取得）</button>
            `}
          </div>
        `;
        list.appendChild(div);
      });
    }

    // 初回表示
    render();
  </script>
</body>
</html>
